version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: devstats-db
    environment:
      POSTGRES_USER: devstats
      POSTGRES_PASSWORD: devstats123
      POSTGRES_DB: devstats
    ports:
      - "5433:5432"
    volumes:
      - devstats_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: devstats-redis
    ports:
      - "6379:6379"

volumes:
  devstats_data: